spring:
  application:
    name: manuscript-ai-backend

  # AI Configuration - Google Gemini
  ai:
    model:
      chat: google-genai

    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-2.5-flash
          response-mime-type: application/json

  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # Database Configuration
  datasource:
    url: jdbc:h2:mem:manuscriptdb
    driverClassName: org.h2.Driver
    username: sa
    password: password

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  # H2 Console
  h2:
    console:
      enabled: true

# Server Configuration
server:
  port: 8080